[project]
name = "hotel-overbooking"
version = "0.1.0"
description = "Predict hotel booking cancellations and decide how many extra bookings to accept each night."
readme = "README.md"
authors = [{ name = "Jihaan Sakariya" }]
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.0",
    "pandas>=2.2",
    "scikit-learn>=1.5",
    "typer>=0.12",
]

[project.scripts]
overbook = "hotel_overbooking.cli:app"

[build-system]
requires = ["uv_build>=0.11.32,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pre-commit>=4.0",
    "pyright>=1.1.400",
    "pytest>=8.0",
    "ruff>=0.12",
]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = ["E501"]

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.12"
typeCheckingMode = "standard"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
